apiVersion: repository.forgejo.m.crossplane.brobald.be/v1alpha1
kind: Repository
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/repository
  labels:
    testing.upbound.io/example-name: personal_defaults
  name: personal-defaults
  namespace: crossplane-system
spec:
  forProvider:
    name: personal_test_repo_defaults

---

apiVersion: organization.forgejo.m.crossplane.brobald.be/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/repository
  labels:
    testing.upbound.io/example-name: owner
  name: owner
  namespace: crossplane-system
spec:
  forProvider:
    name: test_org

---

apiVersion: user.forgejo.m.crossplane.brobald.be/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/repository
  labels:
    testing.upbound.io/example-name: owner
  name: owner
  namespace: crossplane-system
spec:
  forProvider:
    email: test_user@localhost.localdomain
    login: test_user
    passwordSecretRef:
      key: example-key
      name: example-secret
