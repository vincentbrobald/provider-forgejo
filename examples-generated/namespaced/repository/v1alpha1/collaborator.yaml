apiVersion: repository.forgejo.m.crossplane.brobald.be/v1alpha1
kind: Collaborator
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/collaborator
  labels:
    testing.upbound.io/example-name: admin
  name: admin
  namespace: crossplane-system
spec:
  forProvider:
    permission: admin
    repositoryIdSelector:
      matchLabels:
        testing.upbound.io/example-name: org
    user: test_user_defaults

---

apiVersion: organization.forgejo.m.crossplane.brobald.be/v1alpha1
kind: Organization
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/collaborator
  labels:
    testing.upbound.io/example-name: owner
  name: owner
  namespace: crossplane-system
spec:
  forProvider:
    name: test_org

---

apiVersion: repository.forgejo.m.crossplane.brobald.be/v1alpha1
kind: Repository
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/collaborator
  labels:
    testing.upbound.io/example-name: org
  name: org
  namespace: crossplane-system
spec:
  forProvider:
    name: org_test_repo
    ownerSelector:
      matchLabels:
        testing.upbound.io/example-name: owner

---

apiVersion: user.forgejo.m.crossplane.brobald.be/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/collaborator
  labels:
    testing.upbound.io/example-name: test
  name: test
  namespace: crossplane-system
spec:
  forProvider:
    email: test_user@localhost.localdomain
    login: test_user
    passwordSecretRef:
      key: example-key
      name: example-secret
