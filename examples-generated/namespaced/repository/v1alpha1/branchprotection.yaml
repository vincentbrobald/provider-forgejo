apiVersion: repository.forgejo.m.crossplane.brobald.be/v1alpha1
kind: BranchProtection
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/branchprotection
  labels:
    testing.upbound.io/example-name: defaults
  name: defaults
  namespace: crossplane-system
spec:
  forProvider:
    branchName: main
    repositoryIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test_repo

---

apiVersion: repository.forgejo.m.crossplane.brobald.be/v1alpha1
kind: Repository
metadata:
  annotations:
    meta.upbound.io/example-id: repository/v1alpha1/branchprotection
  labels:
    testing.upbound.io/example-name: test_repo
  name: test-repo
  namespace: crossplane-system
spec:
  forProvider:
    autoInit: true
    defaultBranch: custom
    description: Terraform Test Repo owned by user
    issueLabels: Default
    name: personal_test_repo
    private: true
    readme: Default
    template: true
    trustModel: collaborator
    website: http://localhost:3000
